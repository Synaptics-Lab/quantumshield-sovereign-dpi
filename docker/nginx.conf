events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Canopy Explorer (:3000)
    server {
        listen 3000;
        server_name localhost;
        root /usr/share/nginx/html/canopy-explorer;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /rpc {
            proxy_pass https://nodes.synapticchain.xyz/rpc;
            proxy_ssl_server_name on;
            proxy_set_header Host nodes.synapticchain.xyz;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # QuantumShield Terminal Wallet (:3001)
    server {
        listen 3001;
        server_name localhost;
        root /usr/share/nginx/html/quantumshield-terminal;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /rpc {
            proxy_pass https://nodes.synapticchain.xyz/rpc;
            proxy_ssl_server_name on;
            proxy_set_header Host nodes.synapticchain.xyz;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # GovPay Sovereign DPI Suite (:3002)
    server {
        listen 3002;
        server_name localhost;
        root /usr/share/nginx/html/sovereign-dpi-portal;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /rpc {
            proxy_pass https://nodes.synapticchain.xyz/rpc;
            proxy_ssl_server_name on;
            proxy_set_header Host nodes.synapticchain.xyz;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
